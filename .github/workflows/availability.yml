name: Build Availability JSON

permissions:
  contents: write

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      WEBAPP_URL: "https://script.google.com/macros/s/AKfycbwXJNZcjSDtIsktUFheZngN0a85ig_qd5S_D9mnJTvx7PaFqTRzF-Wm4twUlNIjp6mo/exec"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fetch season window (diagnostic)
        id: season
        run: |
          RAW=$(curl -sSL "$WEBAPP_URL?mode=season_window")
          CLEAN=$(echo "$RAW" | sed -n 's/.*<pre>\(.*\)<\/pre>.*/\1/p')
          if [ -z "$CLEAN" ]; then CLEAN="$RAW"; fi

          echo "=== DEBUG season_window RAW ==="
          echo "$RAW"
          echo "=== DEBUG season_window CLEAN ==="
          echo "$CLEAN"

          if ! echo "$CLEAN" | jq empty >/dev/null 2>&1; then
            echo "FATAL: SEASON_WINDOW JSON INVALID"
            mkdir -p data
            echo "$RAW"   > data/error_season_raw.txt
            echo "$CLEAN" > data/error_season_clean.txt
            exit 1
          fi

          START=$(echo "$CLEAN" | jq -r '.season_start')
          END=$(echo "$CLEAN" | jq -r '.season_end')

          echo "Season start: $START"
          echo "Season end:   $END"

          echo "season_start=$START" >> $GITHUB_OUTPUT
          echo "season_end=$END" >> $GITHUB_OUTPUT

      - name: Build availability + search index (file-based, diagnostic)
        run: |
          START="${{ steps.season.outputs.season_start }}"
          END="${{ steps.season.outputs.season_end }}"

          echo "=== BUILD WINDOW ==="
          echo "START=$START"
          echo "END=$END"

          mkdir -p data/tmp_days data/tmp_search

          echo "=== FETCH FIELDS ==="
          FIELDS_RAW=$(curl -sSL "$WEBAPP_URL?mode=fields")
          echo "=== DEBUG FIELDS_RAW (first 2000 chars) ==="
          echo "$FIELDS_RAW" | head -c 2000
          echo

          if ! echo "$FIELDS_RAW" | jq empty >/dev/null 2>&1; then
            echo "FATAL: FIELDS JSON INVALID"
            mkdir -p data
            echo "$FIELDS_RAW" > data/error_fields_raw.txt
            exit 1
          fi

          FIELDS_JSON="$FIELDS_RAW"

          CURRENT="$START"

          echo "=== START DAY LOOP ==="

          while [ "$(date -d "$CURRENT" +%Y-%m-%d)" != "$(date -d "$END + 1 day" +%Y-%m-%d)" ]; do
            echo "---- DAY $CURRENT ----"

            RAW_DAY=$(curl -sSL "$WEBAPP_URL?mode=day_calendar&date=$CURRENT")

            echo "=== DEBUG RAW_DAY (first 2000 chars) for $CURRENT ==="
            echo "$RAW_DAY" | head -c 2000
            echo

            if ! echo "$RAW_DAY" | jq empty >/dev/null 2>&1; then
              echo "FATAL: BAD JSON FOR DATE $CURRENT"
              mkdir -p data
              echo "$RAW_DAY" > "data/error_day_${CURRENT}.json"
              exit 1
            fi

            # Store per-day JSON to file
            echo "$RAW_DAY" > "data/tmp_days/${CURRENT}.json"

            # Build per-day search index file
            COMPLEXES=$(echo "$RAW_DAY" | jq -r '.complex_timeline | keys[]')
            DAY_SEARCH="{}"

            for CX in $COMPLEXES; do
              WINDOWS=$(echo "$RAW_DAY" | jq --arg cx "$CX" '.complex_timeline[$cx]')
              DAY_SEARCH=$(echo "$DAY_SEARCH" | jq --arg cx "$CX" --argjson w "$WINDOWS" '.[$cx] = $w')
            done

            echo "$DAY_SEARCH" > "data/tmp_search/${CURRENT}.json"

            CURRENT=$(date -d "$CURRENT + 1 day" +%Y-%m-%d)
          done

          echo "=== LOOP COMPLETE ==="

          echo "=== BUILD DAYS_JSON FROM FILES ==="
          DAYS_JSON=$(jq -s '
            reduce .[] as $d ({}; .[$d.date] = $d)
          ' data/tmp_days/*.json)

          echo "=== BUILD WEEKS_JSON FROM FILES ==="
          WEEKS_JSON=$(jq -s '
            reduce .[] as $d ({}; 
              .[(($d.date | strptime("%Y-%m-%d") | mktime | strftime("%Y")) + "-W" + ($d.date | strptime("%Y-%m-%d") | mktime | strftime("%U")))] 
              |= (. // {}) | .[$d.date] = $d
            )
          ' data/tmp_days/*.json)

          echo "=== BUILD MONTHS_JSON FROM FILES ==="
          MONTHS_JSON=$(jq -s '
            reduce .[] as $d ({}; 
              .[($d.date | strptime("%Y-%m-%d") | mktime | strftime("%Y-%m"))] 
              |= (. // {}) | .[$d.date] = $d
            )
          ' data/tmp_days/*.json)

          echo "=== BUILD SEARCH_JSON FROM FILES (simple loop) ==="
          SEARCH_JSON="{}"
          for f in data/tmp_search/*.json; do
            d=$(basename "$f" .json)
            s=$(cat "$f")
            SEARCH_JSON=$(echo "$SEARCH_JSON" | jq --arg d "$d" --argjson v "$s" '.[$d] = $v')
          done

          echo "=== VALIDATE ACCUMULATED BLOBS ==="

          echo "$FIELDS_JSON" | jq empty >/dev/null 2>&1 || { echo "FIELDS_JSON invalid AFTER BUILD"; exit 1; }
          echo "$DAYS_JSON"   | jq empty >/dev/null 2>&1 || { echo "DAYS_JSON invalid AFTER BUILD";   exit 1; }
          echo "$WEEKS_JSON"  | jq empty >/dev/null 2>&1 || { echo "WEEKS_JSON invalid AFTER BUILD";  exit 1; }
          echo "$MONTHS_JSON" | jq empty >/dev/null 2>&1 || { echo "MONTHS_JSON invalid AFTER BUILD"; exit 1; }
          echo "$SEARCH_JSON" | jq empty >/dev/null 2>&1 || { echo "SEARCH_JSON invalid AFTER BUILD"; exit 1; }

          echo "=== WRITE DEBUG FILES ==="
          mkdir -p data
          echo "$FIELDS_JSON"  > data/debug_fields.json
          echo "$DAYS_JSON"    > data/debug_days.json
          echo "$WEEKS_JSON"   > data/debug_weeks.json
          echo "$MONTHS_JSON"  > data/debug_months.json
          echo "$SEARCH_JSON"  > data/debug_search.json

          echo "=== FINAL MERGE WITH jq -n ==="

          FINAL_JSON=$(jq -n \
            --arg start "$START" \
            --arg end "$END" \
            --argjson fields "$FIELDS_JSON" \
            --argjson days "$DAYS_JSON" \
            --argjson weeks "$WEEKS_JSON" \
            --argjson months "$MONTHS_JSON" \
            '{
              season_start: $start,
              season_end: $end,
              fields: $fields.fields,
              complexes: $fields.complexes,
              days: $days,
              weeks: $weeks,
              months: $months
            }'
          )

          echo "=== WRITE FINAL FILES ==="
          echo "$FINAL_JSON"  > data/availability.json
          echo "$SEARCH_JSON" > data/search_index.json

      - name: Commit updated JSON + diagnostics
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/availability.json data/search_index.json \
                  data/debug_fields.json data/debug_days.json \
                  data/debug_weeks.json data/debug_months.json \
                  data/debug_search.json \
                  data/error_* || true
          git commit -m "File-based build: availability + search index" || echo "No changes to commit"
          git push || echo "No push"
