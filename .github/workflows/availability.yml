name: Build Availability JSON

permissions:
  contents: write

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      WEBAPP_URL: "https://script.google.com/macros/s/AKfycbwXJNZcjSDtIsktUFheZngN0a85ig_qd5S_D9mnJTvx7PaFqTRzF-Wm4twUlNIjp6mo/exec"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fetch season window
        id: season
        run: |
          RAW=$(curl -sSL "$WEBAPP_URL?mode=season_window")
          CLEAN=$(echo "$RAW" | sed -n 's/.*<pre>\(.*\)<\/pre>.*/\1/p')
          if [ -z "$CLEAN" ]; then CLEAN="$RAW"; fi

          START=$(echo "$CLEAN" | jq -r '.season_start')
          END=$(echo "$CLEAN" | jq -r '.season_end')

          echo "season_start=$START" >> $GITHUB_OUTPUT
          echo "season_end=$END" >> $GITHUB_OUTPUT

      - name: Build availability + search index
        run: |
          START="${{ steps.season.outputs.season_start }}"
          END="${{ steps.season.outputs.season_end }}"

          FIELDS_RAW=$(curl -sSL "$WEBAPP_URL?mode=fields")

          # Validate fields JSON
          if ! echo "$FIELDS_RAW" | jq empty 2>/dev/null; then
            echo "BAD FIELDS JSON — aborting"
            echo "$FIELDS_RAW"
            exit 1
          fi

          FIELDS_JSON="$FIELDS_RAW"

          DAYS_JSON="{}"
          WEEKS_JSON="{}"
          MONTHS_JSON="{}"
          SEARCH_JSON="{}"

          CURRENT="$START"

          while [ "$(date -d "$CURRENT" +%Y-%m-%d)" != "$(date -d "$END + 1 day" +%Y-%m-%d)" ]; do
            RAW_DAY=$(curl -sSL "$WEBAPP_URL?mode=day_calendar&date=$CURRENT")

            # Validate JSON — skip bad days
            if ! echo "$RAW_DAY" | jq empty 2>/dev/null; then
              echo "BAD JSON for $CURRENT — skipping"
              CURRENT=$(date -d "$CURRENT + 1 day" +%Y-%m-%d)
              continue
            fi

            DAY_DATA="$RAW_DAY"

            # DAYS_JSON (stdin merge)
            DAYS_JSON=$(jq --arg d "$CURRENT" '
              .[$d] = input
            ' <<<"$DAYS_JSON" <<<"$DAY_DATA")

            WEEK_ID=$(date -d "$CURRENT" +%Y)-W$(date -d "$CURRENT" +%U)

            # WEEKS_JSON (stdin merge)
            WEEKS_JSON=$(jq --arg w "$WEEK_ID" --arg d "$CURRENT" '
              .[$w] = (.[$w] // {}) | .[$w][$d] = input
            ' <<<"$WEEKS_JSON" <<<"$DAY_DATA")

            MONTH_ID=$(date -d "$CURRENT" +%Y-%m)

            # MONTHS_JSON (stdin merge)
            MONTHS_JSON=$(jq --arg m "$MONTH_ID" --arg d "$CURRENT" '
              .[$m] = (.[$m] // {}) | .[$m][$d] = input
            ' <<<"$MONTHS_JSON" <<<"$DAY_DATA")

            # Build search index
            COMPLEXES=$(jq -r '.complex_timeline | keys[]' <<<"$DAY_DATA")
            DAY_SEARCH="{}"

            for CX in $COMPLEXES; do
              WINDOWS=$(jq --arg cx "$CX" '.complex_timeline[$cx]' <<<"$DAY_DATA")

              DAY_SEARCH=$(jq --arg cx "$CX" '
                .[$cx] = input
              ' <<<"$DAY_SEARCH" <<<"$WINDOWS")
            done

            SEARCH_JSON=$(jq --arg d "$CURRENT" '
              .[$d] = input
            ' <<<"$SEARCH_JSON" <<<"$DAY_SEARCH")

            CURRENT=$(date -d "$CURRENT + 1 day" +%Y-%m-%d)
          done

          # Write blobs to temp files
          echo "$FIELDS_JSON" > /tmp/fields.json
          echo "$DAYS_JSON"   > /tmp/days.json
          echo "$WEEKS_JSON"  > /tmp/weeks.json
          echo "$MONTHS_JSON" > /tmp/months.json

          # Validate big blobs BEFORE final merge
          jq empty /tmp/fields.json  2>/dev/null || { echo "FIELDS_JSON invalid";  cat /tmp/fields.json;  exit 1; }
          jq empty /tmp/days.json    2>/dev/null || { echo "DAYS_JSON invalid";    cat /tmp/days.json;    exit 1; }
          jq empty /tmp/weeks.json   2>/dev/null || { echo "WEEKS_JSON invalid";   cat /tmp/weeks.json;   exit 1; }
          jq empty /tmp/months.json  2>/dev/null || { echo "MONTHS_JSON invalid";  cat /tmp/months.json;  exit 1; }

          FINAL_JSON=$(jq -n \
            --arg start "$START" \
            --arg end "$END" \
            --slurpfile fields /tmp/fields.json \
            --slurpfile days   /tmp/days.json \
            --slurpfile weeks  /tmp/weeks.json \
            --slurpfile months /tmp/months.json \
            '{
              season_start: $start,
              season_end: $end,
              fields: ($fields[0].fields),
              complexes: ($fields[0].complexes),
              days: $days[0],
              weeks: $weeks[0],
              months: $months[0]
            }'
          )

          echo "$FINAL_JSON" > data/availability.json
          echo "$SEARCH_JSON" > data/search_index.json

      - name: Commit updated JSON
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/availability.json data/search_index.json
          git commit -m "Updated availability + search index" || echo "No changes to commit"
          git push
