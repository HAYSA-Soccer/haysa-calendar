name: Build Availability JSON

permissions:
  contents: write

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      WEBAPP_URL: "https://script.google.com/macros/s/AKfycbwXJNZcjSDtIsktUFheZngN0a85ig_qd5S_D9mnJTvx7PaFqTRzF-Wm4twUlNIjp6mo/exec"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fetch season window
        id: season
        run: |
          RAW=$(curl -sSL "$WEBAPP_URL?mode=season_window")
          CLEAN=$(echo "$RAW" | sed -n 's/.*<pre>\(.*\)<\/pre>.*/\1/p')
          if [ -z "$CLEAN" ]; then CLEAN="$RAW"; fi

          if ! echo "$CLEAN" | jq empty >/dev/null 2>&1; then
            echo "Season window JSON invalid"
            exit 1
          fi

          START=$(echo "$CLEAN" | jq -r '.season_start')
          END=$(echo "$CLEAN" | jq -r '.season_end')

          echo "season_start=$START" >> $GITHUB_OUTPUT
          echo "season_end=$END" >> $GITHUB_OUTPUT

      - name: Build availability + search index
        run: |
          START="${{ steps.season.outputs.season_start }}"
          END="${{ steps.season.outputs.season_end }}"

          mkdir -p data/tmp_days data/tmp_search

          # Fetch fields
          FIELDS_RAW=$(curl -sSL "$WEBAPP_URL?mode=fields")
          if ! echo "$FIELDS_RAW" | jq empty >/dev/null 2>&1; then
            echo "Fields JSON invalid"
            exit 1
          fi
          FIELDS_JSON="$FIELDS_RAW"

          CURRENT="$START"

          while [ "$(date -d "$CURRENT" +%Y-%m-%d)" != "$(date -d "$END + 1 day" +%Y-%m-%d)" ]; do
            RAW_DAY=$(curl -sSL "$WEBAPP_URL?mode=day_calendar&date=$CURRENT")

            if ! echo "$RAW_DAY" | jq empty >/dev/null 2>&1; then
              echo "Bad JSON for $CURRENT"
              exit 1
            fi

            echo "$RAW_DAY" > "data/tmp_days/${CURRENT}.json"

            # Build search index for this day
            COMPLEXES=$(echo "$RAW_DAY" | jq -r '.complex_timeline | keys[]')
            DAY_SEARCH="{}"

            for CX in $COMPLEXES; do
              WINDOWS=$(echo "$RAW_DAY" | jq --arg cx "$CX" '.complex_timeline[$cx]')
              DAY_SEARCH=$(echo "$DAY_SEARCH" | jq --arg cx "$CX" --argjson w "$WINDOWS" '.[$cx] = $w')
            done

            echo "$DAY_SEARCH" > "data/tmp_search/${CURRENT}.json"

            CURRENT=$(date -d "$CURRENT + 1 day" +%Y-%m-%d)
          done

          # Build days.json
          DAYS_JSON=$(jq -s '
            reduce .[] as $d ({}; .[$d.date] = $d)
          ' data/tmp_days/*.json)

          # Build weeks.json
          WEEKS_JSON=$(jq -s '
            reduce .[] as $d ({}; 
              .[(($d.date | strptime("%Y-%m-%d") | mktime | strftime("%Y")) 
                + "-W" + 
                ($d.date | strptime("%Y-%m-%d") | mktime | strftime("%U")))] 
              |= (. // {}) | .[$d.date] = $d
            )
          ' data/tmp_days/*.json)

          # Build months.json
          MONTHS_JSON=$(jq -s '
            reduce .[] as $d ({}; 
              .[($d.date | strptime("%Y-%m-%d") | mktime | strftime("%Y-%m"))] 
              |= (. // {}) | .[$d.date] = $d
            )
          ' data/tmp_days/*.json)

          # Build search_index.json
          SEARCH_JSON="{}"
          for f in data/tmp_search/*.json; do
            d=$(basename "$f" .json)
            s=$(cat "$f")
            SEARCH_JSON=$(echo "$SEARCH_JSON" | jq --arg d "$d" --argjson v "$s" '.[$d] = $v')
          done

          # Final merge
          FINAL_JSON=$(jq -n \
            --arg start "$START" \
            --arg end "$END" \
            --argjson fields "$FIELDS_JSON" \
            --argjson days "$DAYS_JSON" \
            --argjson weeks "$WEEKS_JSON" \
            --argjson months "$MONTHS_JSON" \
            '{
              season_start: $start,
              season_end: $end,
              fields: $fields.fields,
              complexes: $fields.complexes,
              days: $days,
              weeks: $weeks,
              months: $months
            }'
          )

          echo "$FINAL_JSON"  > data/availability.json
          echo "$SEARCH_JSON" > data/search_index.json

      - name: Commit updated JSON
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Stage only the real output files
          git add data/availability.json data/search_index.json

          git commit -m "Updated availability + search index" || echo "No changes to commit"
          git push
