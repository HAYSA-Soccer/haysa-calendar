name: Build Availability JSON

permissions:
  contents: write

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Debug: Ping endpoint
        run: |
          echo "=== PING TEST ==="
          curl -v "https://script.google.com/macros/s/AKfycbxsqMLIxgq5CbzkQCovmwDzI8wjlf3KvQOyB0g10JPTVxzmXAaT7m6B13nPmHmLElrO/exec?mode=ping" || true
          echo "=== END PING ==="

      - name: Fetch season window
        id: season
        run: |
          echo "Fetching season window..."

          echo "=== CURL VERBOSE ==="
          curl -v -o season_raw.txt \
            "https://script.google.com/macros/s/AKfycbxsqMLIxgq5CbzkQCovmwDzI8wjlf3KvQOyB0g10JPTVxzmXAaT7m6B13nPmHmLElrO/exec?mode=season_window" || true
          echo "=== END VERBOSE ==="

          echo "=== RAW BODY ==="
          cat season_raw.txt
          echo "=== END RAW BODY ==="

          SEASON_JSON=$(cat season_raw.txt)

          echo "RAW JSON (parsed): $SEASON_JSON"

          # Capture status code
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://script.google.com/macros/s/AKfycbxsqMLIxgq5CbzkQCovmwDzI8wjlf3KvQOyB0g10JPTVxzmXAaT7m6B13nPmHmLElrO/exec?mode=season_window")

          echo "HTTP STATUS: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Non-200 status code"
          fi

          # Try parsing JSON
          START=$(echo "$SEASON_JSON" | jq -r '.season_start' 2>/dev/null || echo "")
          END=$(echo "$SEASON_JSON" | jq -r '.season_end' 2>/dev/null || echo "")

          echo "Parsed START: $START"
          echo "Parsed END: $END"

          echo "season_start=$START" >> $GITHUB_OUTPUT
          echo "season_end=$END" >> $GITHUB_OUTPUT

      - name: Build availability JSON
        run: |
          START="${{ steps.season.outputs.season_start }}"
          END="${{ steps.season.outputs.season_end }}"

          echo "Building availability from $START to $END"

          if [ -z "$START" ] || [ -z "$END" ]; then
            echo "ERROR: START or END is empty — stopping early."
            exit 1
          fi

          DAYS_JSON="{}"
          WEEKS_JSON="{}"
          MONTHS_JSON="{}"

          CURRENT="$START"

          while [ "$(date -d "$CURRENT" +%Y-%m-%d)" != "$(date -d "$END + 1 day" +%Y-%m-%d)" ]; do
            echo "Fetching $CURRENT"

            RAW_DAY=$(curl -s \
              "https://script.google.com/macros/s/AKfycbxsqMLIxgq5CbzkQCovmwDzI8wjlf3KvQOyB0g10JPTVxzmXAaT7m6B13nPmHmLElrO/exec?mode=day&date=$CURRENT")

            echo "RAW DAY: $RAW_DAY"

            DAY_DATA="$RAW_DAY"

            DAYS_JSON=$(echo "$DAYS_JSON" | jq --arg d "$CURRENT" --argjson v "$DAY_DATA" '.[$d] = $v')

            WEEK_ID=$(date -d "$CURRENT" +%Y)-W$(date -d "$CURRENT" +%U)
            WEEKS_JSON=$(echo "$WEEKS_JSON" | jq --arg w "$WEEK_ID" --arg d "$CURRENT" --argjson v "$DAY_DATA" '
              .[$w] = (.[$w] // {}) | .[$w][$d] = $v
            ')

            MONTH_ID=$(date -d "$CURRENT" +%Y-%m)
            MONTHS_JSON=$(echo "$MONTHS_JSON" | jq --arg m "$MONTH_ID" --arg d "$CURRENT" --argjson v "$DAY_DATA" '
              .[$m] = (.[$m] // {}) | .[$m][$d] = $v
            ')

            CURRENT=$(date -d "$CURRENT + 1 day" +%Y-%m-%d)
          done

          FINAL_JSON=$(jq -n \
            --arg start "$START" \
            --arg end "$END" \
            --argjson days "$DAYS_JSON" \
            --argjson weeks "$WEEKS_JSON" \
            --argjson months "$MONTHS_JSON" \
            '{season_start: $start, season_end: $end, days: $days, weeks: $weeks, months: $months}'
          )

          echo "$FINAL_JSON" > data/availability.json

      - name: Commit updated JSON
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/availability.json
          git commit -m "Updated availability.json" || echo "No changes to commit"
          git push
