name: Build Availability JSON

permissions:
  contents: write

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      WEBAPP_URL: "https://script.google.com/macros/s/AKfycbwXJNZcjSDtIsktUFheZngN0a85ig_qd5S_D9mnJTvx7PaFqTRzF-Wm4twUlNIjp6mo/exec"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fetch season window
        id: season
        run: |
          set -e

          RAW=$(curl -sSL "$WEBAPP_URL?mode=season_window")
          CLEAN=$(echo "$RAW" | sed -n 's/.*<pre>\(.*\)<\/pre>.*/\1/p')
          if [ -z "$CLEAN" ]; then CLEAN="$RAW"; fi

          echo "=== DEBUG season_window RAW ==="
          echo "$RAW"
          echo "=== DEBUG season_window CLEAN ==="
          echo "$CLEAN"

          # Validate season JSON
          echo "$CLEAN" | jq empty 2>/dev/null || {
            echo "SEASON_WINDOW JSON INVALID"
            exit 1
          }

          START=$(echo "$CLEAN" | jq -r '.season_start')
          END=$(echo "$CLEAN" | jq -r '.season_end')

          echo "Season start: $START"
          echo "Season end:   $END"

          echo "season_start=$START" >> $GITHUB_OUTPUT
          echo "season_end=$END" >> $GITHUB_OUTPUT

      - name: Build availability + search index (diagnostic)
        run: |
          set -e

          START="${{ steps.season.outputs.season_start }}"
          END="${{ steps.season.outputs.season_end }}"

          echo "=== BUILD WINDOW ==="
          echo "START=$START"
          echo "END=$END"

          echo "=== FETCH FIELDS ==="
          FIELDS_RAW=$(curl -sSL "$WEBAPP_URL?mode=fields")
          echo "=== DEBUG FIELDS_RAW (first 2000 chars) ==="
          echo "$FIELDS_RAW" | head -c 2000
          echo

          # Validate fields JSON HARD (fail, don't skip)
          if ! echo "$FIELDS_RAW" | jq empty 2>/dev/null; then
            echo "FATAL: FIELDS JSON INVALID"
            echo "=== FULL FIELDS_RAW ==="
            echo "$FIELDS_RAW"
            exit 1
          fi

          FIELDS_JSON="$FIELDS_RAW"

          DAYS_JSON="{}"
          WEEKS_JSON="{}"
          MONTHS_JSON="{}"
          SEARCH_JSON="{}"

          CURRENT="$START"

          echo "=== START DAY LOOP ==="

          while [ "$(date -d "$CURRENT" +%Y-%m-%d)" != "$(date -d "$END + 1 day" +%Y-%m-%d)" ]; do
            echo "---- DAY $CURRENT ----"

            RAW_DAY=$(curl -sSL "$WEBAPP_URL?mode=day_calendar&date=$CURRENT")

            echo "=== DEBUG RAW_DAY (first 2000 chars) for $CURRENT ==="
            echo "$RAW_DAY" | head -c 2000
            echo

            # HARD VALIDATION: if this fails, we STOP and see the body
            if ! echo "$RAW_DAY" | jq empty 2>/dev/null; then
              echo "FATAL: BAD JSON FOR DATE $CURRENT"
              echo "=== FULL RAW_DAY FOR $CURRENT ==="
              echo "$RAW_DAY"
              exit 1
            fi

            DAY_DATA="$RAW_DAY"

            # DAYS_JSON (stdin merge)
            DAYS_JSON=$(jq --arg d "$CURRENT" '
              .[$d] = input
            ' <<<"$DAYS_JSON" <<<"$DAY_DATA")

            WEEK_ID=$(date -d "$CURRENT" +%Y)-W$(date -d "$CURRENT" +%U)

            # WEEKS_JSON (stdin merge)
            WEEKS_JSON=$(jq --arg w "$WEEK_ID" --arg d "$CURRENT" '
              .[$w] = (.[$w] // {}) | .[$w][$d] = input
            ' <<<"$WEEKS_JSON" <<<"$DAY_DATA")

            MONTH_ID=$(date -d "$CURRENT" +%Y-%m)

            # MONTHS_JSON (stdin merge)
            MONTHS_JSON=$(jq --arg m "$MONTH_ID" --arg d "$CURRENT" '
              .[$m] = (.[$m] // {}) | .[$m][$d] = input
            ' <<<"$MONTHS_JSON" <<<"$DAY_DATA")

            # Build search index
            COMPLEXES=$(jq -r '.complex_timeline | keys[]' <<<"$DAY_DATA")
            DAY_SEARCH="{}"

            for CX in $COMPLEXES; do
              WINDOWS=$(jq --arg cx "$CX" '.complex_timeline[$cx]' <<<"$DAY_DATA")

              DAY_SEARCH=$(jq --arg cx "$CX" '
                .[$cx] = input
              ' <<<"$DAY_SEARCH" <<<"$WINDOWS")
            done

            SEARCH_JSON=$(jq --arg d "$CURRENT" '
              .[$d] = input
            ' <<<"$SEARCH_JSON" <<<"$DAY_SEARCH")

            CURRENT=$(date -d "$CURRENT + 1 day" +%Y-%m-%d)
          done

          echo "=== LOOP COMPLETE ==="

          echo "=== VALIDATE ACCUMULATED BLOBS ==="

          echo "$FIELDS_JSON" | jq empty 2>/dev/null || { echo "FIELDS_JSON invalid AFTER LOOP"; exit 1; }
          echo "$DAYS_JSON"   | jq empty 2>/dev/null || { echo "DAYS_JSON invalid AFTER LOOP";   exit 1; }
          echo "$WEEKS_JSON"  | jq empty 2>/dev/null || { echo "WEEKS_JSON invalid AFTER LOOP";  exit 1; }
          echo "$MONTHS_JSON" | jq empty 2>/dev/null || { echo "MONTHS_JSON invalid AFTER LOOP"; exit 1; }

          echo "=== WRITE DEBUG FILES ==="
          mkdir -p data
          echo "$FIELDS_JSON"  > data/debug_fields.json
          echo "$DAYS_JSON"    > data/debug_days.json
          echo "$WEEKS_JSON"   > data/debug_weeks.json
          echo "$MONTHS_JSON"  > data/debug_months.json
          echo "$SEARCH_JSON"  > data/debug_search.json

          echo "=== FINAL MERGE WITH jq -n ==="

          # If this fails, we already know all inputs are valid JSON; we’ll see jq’s error.
          FINAL_JSON=$(jq -n \
            --arg start "$START" \
            --arg end "$END" \
            --argjson fields "$FIELDS_JSON" \
            --argjson days "$DAYS_JSON" \
            --argjson weeks "$WEEKS_JSON" \
            --argjson months "$MONTHS_JSON" \
            '{
              season_start: $start,
              season_end: $end,
              fields: $fields.fields,
              complexes: $fields.complexes,
              days: $days,
              weeks: $weeks,
              months: $months
            }'
          )

          echo "=== WRITE FINAL FILES ==="
          echo "$FINAL_JSON"  > data/availability.json
          echo "$SEARCH_JSON" > data/search_index.json

      - name: Commit updated JSON
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/availability.json data/search_index.json \
                  data/debug_fields.json data/debug_days.json \
                  data/debug_weeks.json data/debug_months.json \
                  data/debug_search.json
          git commit -m "Diagnostic build: availability + search index" || echo "No changes to commit"
          git push
