name: Build Availability JSON

permissions:
  contents: write

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      WEBAPP_URL: "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnRYr4AsbhB_k2od42QNnGqprfv7zszTnsVtYSEEciYsJfZiLJ0X8tNeu8iAOEhctrWpJ4etMlMZZpKr3lj4qH7cpb-7aMMa_GLIXF0sv1pb4U61JDGSKLMwbhhyhp_TgcUUenzi8RCxZeM9WT6UpusP50HCM8NqmumNMjHFE5d8GTj60fXFcWJVvYcMxOQ1r-cadA6zjAJdK86TKu4xi8Wx1KSKqbsmIlpW_rbmJUkmJWkbky3h7OIB9IZPZLxJU1M2Wito9rtOvCekGUgP5PtwjbFhxQ5a56DKWd5yadi8ZKh2GBJdTvzY7MROW7RwLgWvaNZ_aKGs6fi-hw6rK9Lw0mNA-Q&lib=MIhjDaA3O95CPuwnhR1KTFMZ3ibJN0JiI"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fetch season window
        id: season
        run: |
          RAW=$(curl -sSL "$WEBAPP_URL?mode=season_window")
          CLEAN=$(echo "$RAW" | sed -n 's/.*<pre>\(.*\)<\/pre>.*/\1/p')
          if [ -z "$CLEAN" ]; then CLEAN="$RAW"; fi

          START=$(echo "$CLEAN" | jq -r '.season_start')
          END=$(echo "$CLEAN" | jq -r '.season_end')

          echo "season_start=$START" >> $GITHUB_OUTPUT
          echo "season_end=$END" >> $GITHUB_OUTPUT

      - name: Build availability + search index
        run: |
          START="${{ steps.season.outputs.season_start }}"
          END="${{ steps.season.outputs.season_end }}"

          FIELDS_RAW=$(curl -sSL "$WEBAPP_URL?mode=fields")
          FIELDS_JSON="$FIELDS_RAW"

          DAYS_JSON="{}"
          WEEKS_JSON="{}"
          MONTHS_JSON="{}"
          SEARCH_JSON="{}"

          CURRENT="$START"

          while [ "$(date -d "$CURRENT" +%Y-%m-%d)" != "$(date -d "$END + 1 day" +%Y-%m-%d)" ]; do
            RAW_DAY=$(curl -sSL "$WEBAPP_URL?mode=day_calendar&date=$CURRENT")
            DAY_DATA="$RAW_DAY"

            DAYS_JSON=$(echo "$DAYS_JSON" | jq --arg d "$CURRENT" --argjson v "$DAY_DATA" '.[$d] = $v')

            WEEK_ID=$(date -d "$CURRENT" +%Y)-W$(date -d "$CURRENT" +%U)
            WEEKS_JSON=$(echo "$WEEKS_JSON" | jq --arg w "$WEEK_ID" --arg d "$CURRENT" --argjson v "$DAY_DATA" '
              .[$w] = (.[$w] // {}) | .[$w][$d] = $v
            ')

            MONTH_ID=$(date -d "$CURRENT" +%Y-%m)
            MONTHS_JSON=$(echo "$MONTHS_JSON" | jq --arg m "$MONTH_ID" --arg d "$CURRENT" --argjson v "$DAY_DATA" '
              .[$m] = (.[$m] // {}) | .[$m][$d] = $v
            ')

            # Build search index for this day
            COMPLEXES=$(echo "$DAY_DATA" | jq -r '.complex_timeline | keys[]')

            DAY_SEARCH="{}"

            for CX in $COMPLEXES; do
              WINDOWS=$(echo "$DAY_DATA" | jq --arg cx "$CX" '.complex_timeline[$cx]')
              DAY_SEARCH=$(echo "$DAY_SEARCH" | jq --arg cx "$CX" --argjson w "$WINDOWS" '.[$cx] = $w')
            done

            SEARCH_JSON=$(echo "$SEARCH_JSON" | jq --arg d "$CURRENT" --argjson v "$DAY_SEARCH" '.[$d] = $v')

            CURRENT=$(date -d "$CURRENT + 1 day" +%Y-%m-%d)
          done

          FINAL_JSON=$(jq -n \
            --arg start "$START" \
            --arg end "$END" \
            --argjson fields "$FIELDS_JSON" \
            --argjson days "$DAYS_JSON" \
            --argjson weeks "$WEEKS_JSON" \
            --argjson months "$MONTHS_JSON" \
            '{
              season_start: $start,
              season_end: $end,
              fields: $fields.fields,
              complexes: $fields.complexes,
              days: $days,
              weeks: $weeks,
              months: $months
            }'
          )

          echo "$FINAL_JSON" > data/availability.json
          echo "$SEARCH_JSON" > data/search_index.json

      - name: Commit updated JSON
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/availability.json data/search_index.json
          git commit -m "Updated availability + search index" || echo "No changes to commit"
          git push
